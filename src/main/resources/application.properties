spring.application.name=conta-certa-api

# Porta: o Render define a variável PORT. Rodando no computador, usa 8080.
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Banco de dados Oracle: SOMENTE por variáveis de ambiente.
# Nenhum usuário, senha ou URL fica escrito no repositório.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool de conexões pequeno: o Oracle da FIAP limita as sessões por aluno.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# CORS: URL do front publicado (opcional). http://localhost:5173 já é liberado no código.
app.cors.front-url=${FRONT_URL:}

# Erros: nunca expor stack trace, mensagem interna nem página HTML.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# Datas no JSON em texto ISO (2026-11-11), não em número.
spring.jackson.serialization.write-dates-as-timestamps=false
